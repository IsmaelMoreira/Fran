<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Fran</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1c070e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💌%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--wine:#5b1526;--ink:#3b1a22;--gold:#d9a441;--env:#ece0c7;--flap:#dfcfae;--inside:#b8a47c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:radial-gradient(ellipse at 50% 40%,#3a0f1d 0%,#1c070e 48%,#080205 100%) #080205}
html,body{height:100%;margin:0}
body{background:transparent;overflow:hidden;font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

.stage{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
.float{position:relative;width:min(84vw,340px);cursor:pointer;outline:none;opacity:0;animation:enter 2.6s .4s ease forwards}
@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.opened .float{cursor:default}

.envelope{position:relative;aspect-ratio:3/2;transform:perspective(1100px) rotateX(14deg) rotateY(-8deg);transition:transform 1s ease}
.opening .envelope{transform:perspective(1100px) rotateX(0deg) rotateY(0deg)}
.part{position:absolute;inset:0}
.back{background:var(--inside);z-index:0;box-shadow:0 28px 60px rgba(0,0,0,.65),0 0 90px rgba(140,25,55,.28)}
.front{background:linear-gradient(165deg,#f3e9d2,var(--env));clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);z-index:3}
.addr{position:absolute;left:0;right:0;top:63%;text-align:center;font:34px/1 'Pinyon Script','Snell Roundhand',cursive;color:var(--wine)}
.addr small{display:block;margin-top:7px;font:italic 500 15px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.14em;color:rgba(91,21,38,.72)}
.flap{bottom:auto;height:52%;background:var(--flap);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transform:perspective(900px) rotateX(0deg);z-index:4;
transition:transform .9s cubic-bezier(.55,0,.25,1),background-color 0s .45s,z-index 0s .45s}
.opening .flap{transform:perspective(900px) rotateX(-180deg);background:#c9b78f;z-index:1}
.seal{position:absolute;left:50%;top:52%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;z-index:6;display:grid;place-items:center;
font:24px/1 'Pinyon Script',cursive;color:rgba(255,226,214,.85);
background:radial-gradient(circle at 35% 30%,#b02c47,#701429 58%,#4a0b19);
box-shadow:0 3px 8px rgba(0,0,0,.5),inset 0 -3px 5px rgba(0,0,0,.35),inset 0 2px 3px rgba(255,255,255,.15);transition:transform .5s ease,opacity .4s ease}
.opening .seal{opacity:0;transform:scale(1.35) rotate(10deg)}

.hint{position:absolute;top:calc(100% + 42px);left:0;right:0;text-align:center;font-size:17px;font-style:italic;letter-spacing:.14em;color:rgba(255,235,225,.7);opacity:0;animation:hint 2.8s 2.8s ease-in-out infinite}
@keyframes hint{0%,100%{opacity:.25}50%{opacity:.85}}
.opening .hint{animation:none;opacity:0}

.letter{position:absolute;left:50%;bottom:6%;width:90%;height:82%;transform:translate(-50%,0);z-index:2;overflow:hidden;border-radius:3px;scrollbar-width:none;
background:linear-gradient(to bottom,transparent 32.6%,rgba(90,50,30,.07) 33.3%,transparent 34%,transparent 65.6%,rgba(90,50,30,.07) 66.3%,transparent 67%),linear-gradient(180deg,#fbf5e8,#f1e6cf);
box-shadow:0 2px 14px rgba(0,0,0,.4)}
.letter::-webkit-scrollbar{display:none}
.rise .letter{transform:translate(-50%,-60%);transition:transform 1.3s cubic-bezier(.45,0,.2,1)}
.done .letter{bottom:50%;width:min(90vw,400px);height:min(78vh,620px);height:min(78dvh,620px);transform:translate(-50%,50%);overflow-y:auto;transition:all 1.4s cubic-bezier(.4,0,.2,1)}
.done .back,.done .front{transform:translateY(46vh);opacity:0;transition:transform 1.1s ease-in,opacity .9s ease-in}
.done .flap{transform:translateY(46vh) perspective(900px) rotateX(-180deg);opacity:0;transition:transform 1.1s ease-in,opacity .9s ease-in}
.done .seal{display:none}

.body{padding:34px 26px 44px;color:var(--ink);font-size:clamp(17px,4.7vw,20px);line-height:1.62;font-weight:500}
.body p{margin:0 0 .9em}
.body .hi{font:32px/1.2 'Pinyon Script','Snell Roundhand',cursive;color:var(--wine);margin-bottom:.5em}
.w{opacity:0;filter:blur(4px);transition:opacity .9s ease,filter .9s ease}
.w.on{opacity:1;filter:none}

.body .final{position:relative;margin-top:34px;text-align:center;font-size:clamp(21px,5.8vw,25px);line-height:1.35;font-style:italic;font-weight:600}
.final::before{content:'';position:absolute;inset:-26px -12px;background:radial-gradient(closest-side,rgba(217,164,65,.42),transparent);opacity:0;pointer-events:none}
.final.show::before{animation:glow 3s ease-out forwards}
@keyframes glow{0%{opacity:0;transform:scale(.6)}35%{opacity:1}100%{opacity:.3;transform:scale(1.08)}}
.final .t{display:inline-block;text-wrap:balance;opacity:0;transform:translateY(8px);transition:opacity 1.8s ease,transform 1.8s ease;
background:linear-gradient(100deg,var(--wine) 38%,#c8952f 50%,var(--wine) 62%) 100% 0/260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.final.show .t{opacity:1;transform:none;animation:sweep 3.2s 1.2s ease-in-out 2}
@keyframes sweep{to{background-position:0 0}}
.spark{position:absolute;background:var(--gold);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);opacity:0;pointer-events:none;animation:twinkle 1.9s ease-in-out 2 both}
@keyframes twinkle{0%{opacity:0;transform:scale(0) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}100%{opacity:0;transform:scale(0) rotate(90deg)}}
.body .bd{font:28px/1.25 'Pinyon Script','Snell Roundhand',cursive;color:var(--wine);text-align:center;margin:1.1em 0 1em}
.confetti{position:fixed;top:-16px;width:8px;height:14px;z-index:20;pointer-events:none;opacity:0;animation:fall linear forwards}
@keyframes fall{0%{opacity:0;transform:translate3d(0,0,0) rotate(0)}8%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate3d(var(--dx),108vh,0) rotate(var(--rot))}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="float" id="open" role="button" tabindex="0" aria-label="Toque para abrir a carta">
    <div class="envelope">
      <div class="part back"></div>
      <div class="letter" id="letter"><div class="body" id="body"></div></div>
      <div class="part front"><div class="addr">Para Fran<small>feliz aniversário</small></div></div>
      <div class="part flap"></div>
      <div class="seal">F</div>
    </div>
    <div class="hint">Toque para abrir.</div>
  </div>
</div>

<script>
// Edite aqui o texto da carta (cada item é um parágrafo).
const LETTER = [
  "Fran,",
  "Hoje é o seu dia, e eu não podia deixar passar em branco. Então escrevi, do jeito mais simples que consegui.",
  "O tempo passou, cada um seguiu o seu caminho, e mesmo assim muita coisa que eu sei hoje ainda carrega o seu jeito.",
  "Tem gente que passa pela nossa vida fazendo barulho. E tem gente que ensina em silêncio, cobra com cuidado e, sem perceber, muda tudo.",
  "Que este novo ano venha cheio de motivos para comemorar, de gente boa por perto e de todo o bem que você merece.",
  "Feliz aniversário, Fran.",
  "Com todo o carinho,"
];
const FINAL = "Algumas pessoas simplesmente deixam uma marca.";

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const stage = $('#stage'), letter = $('#letter'), body = $('#body');

body.innerHTML = LETTER.map((t, i) =>
  `<p${i === 0 ? ' class="hi"' : /^Feliz/.test(t) ? ' class="bd"' : ''}>${t.split(' ').map(w => `<span class="w">${w}</span>`).join(' ')}</p>`
).join('') + `<p class="final" id="final"><span class="t">${FINAL}</span></p>`;

function follow(el) {
  const t = el.offsetTop + el.offsetHeight - letter.clientHeight + 40;
  if (t > letter.scrollTop) letter.scrollTo({ top: t, behavior: 'smooth' });
}

function sparkle(el) {
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('i'), size = 6 + Math.random() * 10;
    s.className = 'spark';
    s.style.cssText = `left:${Math.random() * 100}%;top:${-40 + Math.random() * 180}%;width:${size}px;height:${size}px;animation-delay:${Math.random() * 1.8}s`;
    el.appendChild(s);
  }
}

function confetti() {
  const colors = ['#d9a441', '#f0d089', '#8a2340', '#e7b5b0', '#fbf5e8'];
  for (let i = 0; i < 44; i++) {
    const c = document.createElement('i');
    c.className = 'confetti';
    c.style.cssText = `left:${Math.random() * 100}vw;background:${colors[i % colors.length]};--dx:${(Math.random() - .5) * 120}px;--rot:${360 + Math.random() * 540}deg;animation-duration:${3.6 + Math.random() * 2.4}s;animation-delay:${Math.random() * 1.4}s`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 8500);
  }
}

async function write() {
  for (const p of body.querySelectorAll('p:not(.final)')) {
    follow(p);
    for (const w of p.querySelectorAll('.w')) {
      w.classList.add('on');
      const t = w.textContent;
      await sleep(/[.!?]$/.test(t) ? 520 : /[,;:]$/.test(t) ? 260 : 105);
    }
    await sleep(650);
  }
  await sleep(500);
  const f = $('#final');
  follow(f);
  f.classList.add('show');
  sparkle(f);
  confetti();
}

let opened = false;
async function open() {
  if (opened) return;
  opened = true;
  stage.classList.add('opening', 'opened');
  await sleep(1000);
  stage.classList.add('rise');
  await sleep(1500);
  stage.classList.add('done');
  await sleep(1700);
  write();
}
const trigger = $('#open');
trigger.addEventListener('click', open);
trigger.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
</script>
</body>
</html>
